[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "receipt-splitter"
version = "0.2.0"
description = "A private, local MCP server for parsing receipts and reconciling shared expenses."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{ name = "Gaurav Dama" }]
keywords = ["mcp", "ocr", "receipts", "expense-splitting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "mcp[cli]>=1.16,<2",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.12,<5",
  "pandas>=2.3,<3",
  "pillow>=11.3,<13",
  "pytesseract>=0.3.13,<0.4",
  "rapidfuzz>=3.14,<4",
  "tabulate>=0.9,<0.10",
]

[project.optional-dependencies]
paddle = [
  "paddleocr>=3.2,<4",
  "paddlepaddle>=3.2,<4; platform_machine == 'arm64' or platform_machine == 'x86_64'",
]
dev = [
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
receipt-splitter = "receiptsplitter.server:main"

[project.urls]
Repository = "https://github.com/gauravsdama/receiptSplitter"
Issues = "https://github.com/gauravsdama/receiptSplitter/issues"

[tool.hatch.build.targets.wheel]
packages = ["receiptsplitter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2.*", "paddleocr.*", "pandas.*", "pytesseract.*", "rapidfuzz.*"]
ignore_missing_imports = true
